# Checks every push and pull request; a pushed tag like v0.1.2 also publishes a release
# with two single-file builds: AshenVigil.exe with the recorded songs, and the smaller
# AshenVigil-Synth.exe with the synthesized music only.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Tests
        run: cargo test --release

      - name: Clippy without songs
        run: cargo clippy --release --no-default-features -- -D warnings

      - name: Build
        run: |
          cargo build --release
          Copy-Item target/release/ashen-vigil.exe AshenVigil.exe
          cargo build --release --no-default-features
          Copy-Item target/release/ashen-vigil.exe AshenVigil-Synth.exe

      - uses: actions/upload-artifact@v4
        with:
          name: AshenVigil
          path: |
            AshenVigil.exe
            AshenVigil-Synth.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AshenVigil

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" AshenVigil.exe AshenVigil-Synth.exe --repo "$GITHUB_REPOSITORY" --title "Ashen Vigil $GITHUB_REF_NAME" --generate-notes
