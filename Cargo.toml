[package]
name = "ashen-vigil"
version = "0.9.0"
license = "MIT"
edition = "2021"

[dependencies]
gilrs = "0.11.2"
macroquad = { version = "0.4", features = ["audio"] }
hound = "3.5"
lewton = "0.9"
miniz_oxide = "0.8"
serde_json = "1"

# The Android build (cargo quad-apk, see scripts/android.ps1): landscape, full screen.
[package.metadata.android]
# The last part names the library to load, so it keeps the crate's hyphen (the app id becomes
# com.notenoughsp.ashen_vigil).
package_name = "com.notenoughsp.ashen-vigil"
label = "Ashen Vigil"
res = "android/res"
icon = "@mipmap/ic_launcher"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
fullscreen = true
android_version = 31
target_sdk_version = 31
min_sdk_version = 24

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "userLandscape"
"android:exported" = "true"

[[package.metadata.android.permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[patch.crates-io]
# quad-snd with a fast path for samples decoded ahead of time (see vendor/quad-snd/PATCHED.md).
quad-snd = { path = "vendor/quad-snd" }

[features]
default = ["songs"]
# The recorded songs of assets/music, embedded. Without it the game plays only its
# synthesized music (the smaller AshenVigil-Synth.exe).
songs = []

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
