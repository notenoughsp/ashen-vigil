[package]
name = "ashen-vigil"
version = "0.6.0"
license = "MIT"
edition = "2021"

[dependencies]
gilrs = "0.11.2"
macroquad = { version = "0.4", features = ["audio"] }
hound = "3.5"
lewton = "0.9"
miniz_oxide = "0.8"
serde_json = "1"

[patch.crates-io]
# quad-snd with a fast path for samples decoded ahead of time (see vendor/quad-snd/PATCHED.md).
quad-snd = { path = "vendor/quad-snd" }

[features]
default = ["songs"]
# The recorded songs of assets/music, embedded. Without it the game plays only its
# synthesized music (the smaller AshenVigil-Synth.exe).
songs = []

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
