[package]
name = "ashen-vigil"
version = "0.3.3"
license = "MIT"
edition = "2021"

[dependencies]
gilrs = "0.11.2"
macroquad = { version = "0.4", features = ["audio"] }
miniz_oxide = "0.8"
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
